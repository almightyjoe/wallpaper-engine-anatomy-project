<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" class="anatomy-layer-svg">
  <title>Muscular system layer (placeholder)</title>
  <desc>Major superficial muscle groups, simplified. Replace with accurate muscular artwork (e.g. traced from open-licensed anatomical atlases) aligned to the same 400x800 coordinate space.</desc>

  <g id="region-head" data-region="head" fill="#c1605a" stroke="#8f3f3b" stroke-width="1.5" opacity="0.85">
    <path d="M165,75 C160,55 175,35 200,35 C225,35 240,55 235,75 C238,90 225,100 200,102 C175,100 162,90 165,75 Z" />
  </g>

  <g id="region-torso" data-region="torso" fill="#c1605a" stroke="#8f3f3b" stroke-width="1.5" opacity="0.85">
    <!-- pectorals -->
    <path d="M150,150 C175,145 195,150 200,165 C205,150 225,145 250,150 C250,180 225,195 200,195 C175,195 150,180 150,150 Z" />
    <!-- abdominals -->
    <rect x="180" y="200" width="40" height="120" rx="6" />
    <line x1="200" y1="200" x2="200" y2="320" />
    <line x1="180" y1="225" x2="220" y2="225" />
    <line x1="180" y1="250" x2="220" y2="250" />
    <line x1="180" y1="275" x2="220" y2="275" />
    <line x1="180" y1="300" x2="220" y2="300" />
    <!-- obliques -->
    <path d="M150,200 C145,250 150,300 165,330 L180,320 L180,205 Z" opacity="0.7" />
    <path d="M250,200 C255,250 250,300 235,330 L220,320 L220,205 Z" opacity="0.7" />
  </g>

  <g id="region-arms" data-region="arms" fill="#c1605a" stroke="#8f3f3b" stroke-width="1.5" opacity="0.85">
    <!-- biceps/triceps -->
    <ellipse cx="100" cy="200" rx="22" ry="48" />
    <ellipse cx="300" cy="200" rx="22" ry="48" />
    <!-- forearms -->
    <ellipse cx="98" cy="320" rx="18" ry="55" />
    <ellipse cx="302" cy="320" rx="18" ry="55" />
  </g>

  <g id="region-legs" data-region="legs" fill="#c1605a" stroke="#8f3f3b" stroke-width="1.5" opacity="0.85">
    <!-- quadriceps -->
    <ellipse cx="167" cy="450" rx="28" ry="85" />
    <ellipse cx="233" cy="450" rx="28" ry="85" />
    <!-- calves -->
    <ellipse cx="167" cy="610" rx="24" ry="65" />
    <ellipse cx="233" cy="610" rx="24" ry="65" />
  </g>
</svg>
