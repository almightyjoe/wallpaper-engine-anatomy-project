    <line x1="200" y1="100" x2="200" y2="358" />
    <!-- nerve branches -->
    <path d="M200,150 C180,160 165,170 155,185" stroke-width="1.5" />
    <path d="M200,150 C220,160 235,170 245,185" stroke-width="1.5" />
    <path d="M200,230 C185,245 170,260 160,280" stroke-width="1.5" />
    <path d="M200,230 C215,245 230,260 240,280" stroke-width="1.5" />
  </g>

  <g id="region-arms" data-region="arms" fill="none" stroke="#e8d44d" stroke-width="1.5">
    <path d="M155,185 C130,210 110,250 100,300 C97,340 98,370 98,395" />
    <path d="M245,185 C270,210 290,250 300,300 C303,340 302,370 302,395" />
  </g>

  <g id="region-legs" data-region="legs" fill="none" stroke="#e8d44d" stroke-width="1.5">
