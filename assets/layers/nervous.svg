<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" class="anatomy-layer-svg">
  <title>Nervous system layer (placeholder)</title>
  <desc>Simplified brain, spinal cord, and major peripheral nerve trunks. Replace with accurate neural artwork aligned to the same 400x800 coordinate space.</desc>

  <g id="region-head" data-region="head" fill="none" stroke="#e8d44d" stroke-width="2">
    <ellipse cx="200" cy="62" rx="32" ry="26" fill="#e8d44d" opacity="0.5" id="region-brain" data-region="brain" />
    <path d="M180,50 C190,40 210,40 220,50" />
    <path d="M180,65 C190,75 210,75 220,65" />
  </g>

  <g id="region-torso" data-region="torso" fill="none" stroke="#e8d44d" stroke-width="3">
